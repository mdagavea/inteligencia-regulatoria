name: Disparo de Email do Clipping
on:
  push:
    paths:
      - "email_dispatch.json"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execucao (disparo ou inspecao_trial)"
        required: false
        default: "inspecao_trial"

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspecionar Trial Agencia iNFRA via IMAP
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'inspecao_trial'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, imaplib, email, json, re
          from email.header import decode_header
          from pathlib import Path

          def dec_str(val):
              if not val:
                  return ""
              parts = decode_header(val)
              out = []
              for text, enc in parts:
                  if isinstance(text, bytes):
                      out.append(text.decode(enc or 'utf-8', errors='replace'))
                  else:
                      out.append(str(text))
              return "".join(out)

          out_dir = Path("trial_dump")
          out_dir.mkdir(exist_ok=True)

          user = os.environ["GMAIL_USER"].strip()
          pwd = os.environ["GMAIL_APP_PASSWORD"].replace(" ", "").strip()

          M = imaplib.IMAP4_SSL("imap.gmail.com", 993)
          M.login(user, pwd)

          # Find All Mail folder
          status, folders = M.list()
          all_mail_box = "INBOX"
          for f in folders:
              f_str = f.decode("utf-8", errors="replace")
              if "\\All" in f_str or "Todos" in f_str or "All Mail" in f_str:
                  m = re.search(r'"([^"]+)"$', f_str)
                  if m:
                      all_mail_box = m.group(1)
                      break

          print("Using mailbox:", all_mail_box)
          M.select(f'"{all_mail_box}"', readonly=True)

          queries = [
              'newer_than:21d agenciainfra',
              'newer_than:21d clipping',
              'newer_than:21d infra',
              'newer_than:15d has:attachment'
          ]

          all_uids = set()
          for q in queries:
              try:
                  typ, data = M.uid('SEARCH', 'X-GM-RAW', f'"{q}"')
                  uids = data[0].split() if data and data[0] else []
                  print(f"Query [{q}] -> {len(uids)} messages")
                  for u in uids:
                      all_uids.add(u)
              except Exception as e:
                  print(f"Query [{q}] error: {e}")

          manifest = []
          for uid in sorted(all_uids, key=lambda x: int(x)):
              uid_str = uid.decode()
              typ, msg_data = M.uid('FETCH', uid, '(RFC822)')
              if typ != 'OK' or not msg_data or not msg_data[0]:
                  continue
              raw_email = msg_data[0][1]
              msg = email.message_from_bytes(raw_email)
              subj = dec_str(msg.get("Subject", ""))
              frm = dec_str(msg.get("From", ""))
              dt = dec_str(msg.get("Date", ""))

              # Extract text/plain, text/html, and attachments
              text_parts = []
              html_parts = []
              attachments = []

              msg_folder = out_dir / f"msg_{uid_str}"
              msg_folder.mkdir(exist_ok=True)

              for idx, part in enumerate(msg.walk()):
                  ctype = part.get_content_type()
                  cdisp = str(part.get("Content-Disposition") or "")
                  fname = dec_str(part.get_filename() or "")

                  if fname or "attachment" in cdisp.lower():
                      safe_name = re.sub(r'[\\/*?:"<>|]', '_', fname or f"attach_{idx}.bin")
                      payload = part.get_payload(decode=True)
                      if payload:
                          att_path = msg_folder / safe_name
                          att_path.write_bytes(payload)
                          attachments.append({
                              "filename": safe_name,
                              "content_type": ctype,
                              "size": len(payload)
                          })
                  elif ctype == "text/plain":
                      payload = part.get_payload(decode=True)
                      if payload:
                          charset = part.get_content_charset() or "utf-8"
                          text_parts.append(payload.decode(charset, errors="replace"))
                  elif ctype == "text/html":
                      payload = part.get_payload(decode=True)
                      if payload:
                          charset = part.get_content_charset() or "utf-8"
                          html_parts.append(payload.decode(charset, errors="replace"))

              if text_parts:
                  (msg_folder / "body.txt").write_text("\n\n".join(text_parts), encoding="utf-8")
              if html_parts:
                  (msg_folder / "body.html").write_text("\n\n".join(html_parts), encoding="utf-8")

              info = {
                  "uid": uid_str,
                  "date": dt,
                  "from": frm,
                  "subject": subj,
                  "attachments": attachments,
                  "has_text": bool(text_parts),
                  "has_html": bool(html_parts)
              }
              manifest.append(info)
              print(f"UID {uid_str} | {dt} | {frm} | {subj} | Att: {[a['filename'] for a in attachments]}")

          (out_dir / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          M.logout()
          EOF

      - name: Upload Trial Dump Artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.modo == 'inspecao_trial'
        uses: actions/upload-artifact@v4
        with:
          name: trial-dump
          path: trial_dump/
          retention-days: 1

      - name: Enviar e-mail via Gmail SMTP
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.modo != 'inspecao_trial'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, json, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          if not os.path.exists('email_dispatch.json'):
              print('Arquivo email_dispatch.json nao encontrado.')
              exit(0)

          with open('email_dispatch.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          dests = [d.strip() for d in data.get('destinatarios', []) if d.strip()]
          if not dests:
              print('Nenhum destinatario.')
              exit(0)

          user = os.environ['GMAIL_USER']
          pwd = os.environ['GMAIL_APP_PASSWORD']

          msg = MIMEMultipart('alternative')
          msg['Subject'] = data.get('assunto', 'Clipping Diario Executivo - DECON/MPOR')
          msg['From'] = f'Clipping Executivo DECON/MPOR <{user}>'
          msg['To'] = ', '.join(dests)
          msg.attach(MIMEText(data.get('corpo_html', ''), 'html', 'utf-8'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(user, pwd)
              s.sendmail(user, dests, msg.as_string())
          print('E-mail enviado com sucesso para:', dests)
          EOF

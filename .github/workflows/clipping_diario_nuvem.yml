name: Clipping Diario e Radar na Nuvem (DECON/MPOR)

on:
  schedule:
    # Minutos quebrados para contornar filas de horário de pico no GitHub Actions:
    # Tentativa 1: 07:17 BRT (10:17 UTC) — Faixa prioritária matinal
    - cron: "17 10 * * 1-5"
    # Tentativa 2: 08:43 BRT (11:43 UTC) — Redundância intermediária caso a primeira atrase
    - cron: "43 11 * * 1-5"
    # Tentativa 3: 10:18 BRT (13:18 UTC) — Salvaguarda tardia para garantir entrega
    - cron: "18 13 * * 1-5"
  workflow_dispatch:
    inputs:
      forcar_reexecucao:
        description: "Forcar nova geracao e envio mesmo se a edicao de hoje ja existir?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      modo_teste:
        description: "Modo teste? (se verdadeiro, envia apenas para o secret EMAIL_TESTE)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  gerar_e_publicar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar se a edicao de hoje ja foi publicada e enviada
        id: check_hoje
        run: |
          HOJE=$(date +%Y-%m-%d)
          FORCAR="${{ github.event.inputs.forcar_reexecucao }}"
          if [ -f "historico/.email_enviado_${HOJE}" ] && [ "$FORCAR" != "true" ]; then
            echo "ja_existe=true" >> $GITHUB_OUTPUT
            echo "Edicao de hoje (${HOJE}) ja foi gerada e e-mail ja enviado. Encerrando sem duplicidade."
          else
            echo "ja_existe=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Python 3.12
        if: steps.check_hoje.outputs.ja_existe != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        if: steps.check_hoje.outputs.ja_existe != 'true'
        run: pip install -r requirements.txt

      - name: Executar Coleta, Curadoria (Gemini/Contingencia) e Renderizacao
        if: steps.check_hoje.outputs.ja_existe != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINATARIOS: ${{ (github.event.inputs.modo_teste == 'true' || github.event.inputs.modo_teste == true) && secrets.EMAIL_TESTE || secrets.EMAIL_DESTINATARIOS }}
        run: |
          python clipping/gerar_clipping.py --headless --force

      - name: Trava de Seguranca Editorial (Varredura de Termos Proibidos no HTML)
        if: steps.check_hoje.outputs.ja_existe != 'true'
        run: |
          python radar_participativo/validador_publicacao.py clipping.html

      - name: Publicar paineis atualizados no GitHub Pages (commit & push)
        if: steps.check_hoje.outputs.ja_existe != 'true'
        run: |
          HOJE_BR=$(date +%d/%m/%Y)
          git config user.name "DECON/MPOR Bot (GitHub Actions)"
          git config user.email "actions@github.com"
          # email_dispatch.json NAO entra no commit: contem os e-mails dos destinatarios (repositorio publico).
          # Ele e lido no proprio job, no passo de envio abaixo, direto da pasta de trabalho.
          git add clipping.html historico/ radar_participativo/historico_processos.json || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao nos arquivos para commit."
          else
            git commit -m "Publicacao automatica na nuvem — Clipping (${HOJE_BR})"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Disparar Boletim por E-mail via Gmail SMTP
        if: steps.check_hoje.outputs.ja_existe != 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, json, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          if not os.path.exists('email_dispatch.json'):
              print('Arquivo email_dispatch.json nao encontrado.')
              exit(0)

          with open('email_dispatch.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          dests = [d.strip() for d in data.get('destinatarios', []) if d.strip()]
          if not dests:
              print('Nenhum destinatario configurado.')
              exit(0)

          user = os.environ['GMAIL_USER']
          pwd = os.environ['GMAIL_APP_PASSWORD']

          msg = MIMEMultipart('alternative')
          msg['Subject'] = data.get('assunto', 'Clipping Diario Executivo - DECON/MPOR')
          msg['From'] = f'Clipping Executivo DECON/MPOR <{user}>'
          msg['To'] = ', '.join(dests)
          msg.attach(MIMEText(data.get('corpo_html', ''), 'html', 'utf-8'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(user, pwd)
              s.sendmail(user, dests, msg.as_string())
          qtd = len(dests)
          plur = 'destinatário' if qtd == 1 else 'destinatários'
          print(f'E-mail enviado com sucesso na nuvem para {qtd} {plur}.')

          # Grava marcador local de e-mail enviado (sem dados de destinatarios para preservar privacidade)
          hoje_iso = data.get('timestamp', '')[:10]
          if not hoje_iso:
              from datetime import datetime
              hoje_iso = datetime.now().strftime('%Y-%m-%d')
          os.makedirs('historico', exist_ok=True)
          with open(os.path.join('historico', f'.email_enviado_{hoje_iso}'), 'w', encoding='utf-8') as f:
              f.write('ok\n')
          EOF

      - name: Registrar marcador de e-mail enviado no repositorio
        if: steps.check_hoje.outputs.ja_existe != 'true'
        run: |
          HOJE=$(date +%Y-%m-%d)
          if [ -f "historico/.email_enviado_${HOJE}" ]; then
            git config user.name "DECON/MPOR Bot (GitHub Actions)"
            git config user.email "actions@github.com"
            git add "historico/.email_enviado_${HOJE}"
            if git diff --staged --quiet; then
              echo "Marcador ja comitado."
            else
              git commit -m "Registra envio de e-mail do Clipping (${HOJE})"
              git pull --rebase origin main || true
              git push origin main
            fi
          fi
